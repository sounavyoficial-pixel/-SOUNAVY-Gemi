<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaIA IP - Borda Soberana</title>
    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #161b22;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .status-tag {
            background: #238636;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        main {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .terminal-box {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #58a6ff;
            flex: 1;
            overflow-y: auto;
        }
        #gaia-bolinha {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 28px;
            height: 28px;
            background: #2ea043;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(46, 160, 67, 0.8);
            cursor: pointer;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <header>
        <span>SOUNAVY // GAIA-IP</span>
        <span class="status-tag">BORDA ATIVA</span>
    </header>

    <main>
        <h2>Soberania de Borda</h2>
        <p style="font-size: 14px; color: #8b949e;">Toque na Bolinha para isolar a intenção no enclave local.</p>
        <div class="terminal-box" id="log-panel">
            [SYS]: Chassi inicializado com sucesso.<br>
            [STATUS]: Aguardando o comando do Arquiteto.
        </div>
    </main>

    <div id="gaia-bolinha" title="Farol Tátil GaIA"></div>

    <script>
        document.getElementById('gaia-bolinha').addEventListener('click', () => {
            const timestamp = new Date().toLocaleTimeString();
            const panel = document.getElementById('log-panel');
            panel.innerHTML += `<br>[${timestamp} - SEMENTE]: Intenção isolada na borda com sucesso.`;
            panel.scrollTop = panel.scrollHeight;
        });
    </script>
</body>
</html>
